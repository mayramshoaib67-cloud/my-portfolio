const { useState, useEffect, useRef, useCallback } = React;

/* ---------- Accessible motion ---------- */
function useReducedMotion() {
  const [reduced, setReduced] = useState(() => matchMedia('(prefers-reduced-motion: reduce)').matches);
  useEffect(() => {
    const media = matchMedia('(prefers-reduced-motion: reduce)');
    const update = () => setReduced(media.matches);
    media.addEventListener('change', update);
    return () => media.removeEventListener('change', update);
  }, []);
  return reduced;
}
function TypedRole() {
  const reduced = useReducedMotion();
  const [text, setText] = useState('Graphic Designer');
  useEffect(() => {
    if (reduced) return;
    const roles = ['Graphic Designer', 'UI Designer', 'Brand Designer'];
    let word = 0, count = roles[0].length, deleting = true, timer;
    const tick = () => {
      if (document.hidden) {timer = setTimeout(tick, 500); return;}
      count += deleting ? -1 : 1;
      setText(roles[word].slice(0, count));
      let delay = deleting ? 45 : 85;
      if (count === 0) {deleting = false; word = (word + 1) % roles.length; delay = 300;}
      else if (count === roles[word].length) {deleting = true; delay = 2100;}
      timer = setTimeout(tick, delay);
    };
    timer = setTimeout(tick, 2100);
    return () => clearTimeout(timer);
  }, [reduced]);
  return <div className="typed-role"><span className="sr-only">Graphic Designer, UI Designer and Brand Designer</span><span aria-hidden="true">{reduced ? 'Graphic & UI Designer' : text}<i className="typing-caret" /></span></div>;
}
function Counter({ value, suffix = '' }) {
  const ref = useRef(null);
  const [count, setCount] = useState(0);
  const reduced = useReducedMotion();
  useEffect(() => {
    if (reduced) {setCount(value); return;}
    let frame;
    const observer = new IntersectionObserver(([entry]) => {
      if (!entry.isIntersecting) return;
      observer.disconnect();
      const start = performance.now();
      const tick = now => {
        const progress = Math.min((now - start) / 1300, 1);
        setCount(Math.round(value * (1 - Math.pow(1 - progress, 3))));
        if (progress < 1) frame = requestAnimationFrame(tick);
      };
      frame = requestAnimationFrame(tick);
    }, {threshold: .5});
    observer.observe(ref.current);
    return () => {observer.disconnect(); cancelAnimationFrame(frame);};
  }, [value, reduced]);
  return <span ref={ref}><span className="sr-only">{value}{suffix}</span><span aria-hidden="true">{count}{suffix}</span></span>;
}
function SocialLinks() {

function MotionEffects() {
  const reduced = useReducedMotion();
  useEffect(() => {
    if (reduced) return;
    const fine = matchMedia('(hover: hover) and (pointer: fine)');
    const cursor = document.querySelector('.cursor-ring');
    const hero = document.querySelector('.collage-wrap');
    const heroBackground = document.querySelector('.hero');
    let pointerFrame = 0, scrollFrame = 0, activeButton, activeCard;
    let latest;
    function clearButton() {if (activeButton) {activeButton.style.removeProperty('--mx');activeButton.style.removeProperty('--my');activeButton = null;}}
    function clearCard() {if (activeCard) {activeCard.style.removeProperty('--rx');activeCard.style.removeProperty('--ry');activeCard = null;}}
    function move(e) {
      if (!fine.matches) return;
      latest = e;
      if (pointerFrame) return;
      pointerFrame = requestAnimationFrame(() => {
        pointerFrame = 0;
        const {clientX:x, clientY:y, target} = latest;
        cursor.style.setProperty('--cx', `${x}px`);cursor.style.setProperty('--cy', `${y}px`);
        cursor.classList.add('visible');cursor.classList.toggle('interactive', !!target.closest('a,button'));
        const button = [...document.querySelectorAll('.btn,.social-links a,.nav-cta')].find(el => {
          const r = el.getBoundingClientRect();return x > r.left - 22 && x < r.right + 22 && y > r.top - 22 && y < r.bottom + 22;
        });
        if (activeButton !== button) clearButton();
        if (button) {activeButton = button;const r = button.getBoundingClientRect();button.style.setProperty('--mx', `${Math.max(-8,Math.min(8,(x-r.left-r.width/2)*.13))}px`);button.style.setProperty('--my', `${Math.max(-6,Math.min(6,(y-r.top-r.height/2)*.18))}px`);}
        const card = target.closest('.work-card');
        if (activeCard !== card) clearCard();
        if (card) {activeCard = card;const r=card.getBoundingClientRect();card.style.setProperty('--rx', `${-(y-r.top-r.height/2)/r.height*9}deg`);card.style.setProperty('--ry', `${(x-r.left-r.width/2)/r.width*9}deg`);}
        if (heroBackground) {const r = heroBackground.getBoundingClientRect();if (y <= r.bottom) {heroBackground.style.setProperty('--gx', `${x/innerWidth*100}%`);heroBackground.style.setProperty('--gy', `${(y-r.top)/r.height*100}%`);}}
      });
    }
    function leave() {cursor.classList.remove('visible');clearButton();clearCard();}
    function scroll() {
      if (scrollFrame) return;
      scrollFrame = requestAnimationFrame(() => {scrollFrame = 0;if (hero && fine.matches) hero.style.setProperty('--parallax', `${Math.min(scrollY,700)*.12}px`);});
    }
    function transition(e) {
      const link = e.target.closest('a[href^="#"]');
      if (!link) return;
      const section = document.getElementById(link.getAttribute('href').slice(1));
      if (section) section.animate([{filter:'brightness(.85)'},{filter:'brightness(1)'}],{duration:650,easing:'ease-out'});
    }
    document.addEventListener('pointermove',move,{passive:true});
    document.documentElement.addEventListener('pointerleave',leave);
    window.addEventListener('blur',leave);
    window.addEventListener('scroll',scroll,{passive:true});
    document.addEventListener('click',transition);
    return () => {
      document.removeEventListener('pointermove',move);document.documentElement.removeEventListener('pointerleave',leave);window.removeEventListener('blur',leave);window.removeEventListener('scroll',scroll);document.removeEventListener('click',transition);
      cancelAnimationFrame(pointerFrame);cancelAnimationFrame(scrollFrame);leave();
      if(hero) hero.style.removeProperty('--parallax');
    };
  }, [reduced]);
  return <div className="cursor-ring" aria-hidden="true" />;
}

/* ---------- shared: scroll reveal hook ---------- */
function useReveal(options = {}) {
  const ref = useRef(null);
  useEffect(() => {
    const el = ref.current;
    if (!el) return;
    const obs = new IntersectionObserver(
      (entries) => {
        entries.forEach((entry) => {
          if (entry.isIntersecting) {
            entry.target.classList.add('in-view');
            obs.unobserve(entry.target);
          }
        });
      },
      { threshold: 0.15, ...options }
    );
    obs.observe(el);
    return () => obs.disconnect();
  }, []);
  return ref;
}

function Reveal({ as: Tag = 'div', className = '', stagger = false, variant = 'up', children, ...rest }) {
  const ref = useReveal();
  const base = variant === 'left' ? 'reveal-left' : variant === 'zoom' ? 'reveal-zoom' : 'reveal';
  const staggerClass = variant === 'left' ? 'reveal-left-stagger' : variant === 'zoom' ? 'reveal-zoom-stagger' : 'reveal-stagger';
  return (
    <Tag ref={ref} className={`${stagger ? staggerClass : base} ${className}`} {...rest}>
      {children}
    </Tag>
  );
}

function Portfolio() {
  const [active, setActive] = useState('All');
  const [position, setPosition] = useState(0);
  const [canNext, setCanNext] = useState(false);
  const track = useRef(null);
  const filtered = active === 'All' ? WORKS : WORKS.filter(w => w.cat === active);
  useEffect(() => {
    const el = track.current;
    const update = () => setCanNext(el.scrollLeft < el.scrollWidth - el.clientWidth - 2);
    const resize = new ResizeObserver(update);
    resize.observe(el);

    update();

  }, [active]);

    const el = track.current;

    el.scrollBy({left: direction * step, behavior: 'smooth'});
  }

  );
}

  return <div className="testi-card">
    <div className="quote-mark" aria-hidden="true">“</div>
    <p>{t.quote}</p>
    <div className="testi-person">
      <img className="testi-avatar" src={t.avatar} alt="" aria-hidden="true" loading="lazy" />
      <div><strong>{t.name}</strong><span>{t.role}</span></div>
    </div>
  </div>;
}
function Testimonials() {
  const [current, setCurrent] = useState(0);
  const [fading, setFading] = useState(false);
  const [paused, setPaused] = useState(false);
  const [hovered, setHovered] = useState(false);
  const timer = useRef(null);
  const busy = useRef(false);
  const reduced = useRef(window.matchMedia('(prefers-reduced-motion: reduce)').matches);
  const change = useCallback((next) => {
    if (busy.current) return;
    if (reduced.current) { setCurrent(next); return; }
    busy.current = true;
    setFading(true);
    timer.current = setTimeout(() => {
      setCurrent(next);
      setFading(false);
      busy.current = false;
    }, 350);
  }, []);
  useEffect(() => () => clearTimeout(timer.current), []);
  useEffect(() => {
    if (paused || hovered || reduced.current) return;
    const interval = setInterval(() => change((current + 1) % TESTIMONIALS.length), 5500);
    return () => clearInterval(interval);
  }, [current, paused, hovered, change]);
  return (
    <section id="testimonials" className="testimonials">
      <div className="container">
        <div className="testimonial-spotlight" onMouseEnter={() => setHovered(true)} onMouseLeave={() => setHovered(false)}
          onFocusCapture={() => setHovered(true)} onBlurCapture={e => {if (!e.currentTarget.contains(e.relatedTarget)) setHovered(false);}}>
          <div className={`featured-testimonial ${fading ? 'fading' : ''}`} aria-live={paused ? 'polite' : 'off'}>
            <TestimonialCard t={TESTIMONIALS[current]} index={current} />
          </div>
          <div className="spotlight-copy section-head">
            <p className="eyebrow">Kind words</p>
            <h2>What people say.</h2>
            <p>Good design starts with listening. A little space for the people behind the projects.</p>
            <p className="sample-note">Sample testimonials — replace with real client feedback.</p>
            <div className="spotlight-controls">
              <div className="carousel-arrows">
                <button aria-label="Previous testimonial" onClick={() => change((current + TESTIMONIALS.length - 1) % TESTIMONIALS.length)}>←</button>
                <button aria-label="Next testimonial" onClick={() => change((current + 1) % TESTIMONIALS.length)}>→</button>
              </div>
              <span className="slide-count">{String(current+1).padStart(2,'0')} / 03</span>
              {!reduced.current && <button className="pause-button" onClick={() => setPaused(p => !p)}>{paused ? 'Play' : 'Pause'}</button>}
            </div>
            <div className="slide-dots" aria-label="Choose testimonial">
              {TESTIMONIALS.map((t,i) => <button key={i} aria-label={`Show testimonial ${i+1}`} aria-pressed={current === i} className={current === i ? 'active' : ''} onClick={() => change(i)} />)}
            </div>
          </div>
        </div>
      </div>
    </section>
  );
}

/* ---------- CONTACT ---------- */
function Contact() {
  const [status, setStatus] = useState('idle');

  const openMailFallback = (data) => {
    const name = data.get('name') || '';
    const email = data.get('email') || '';
    const message = data.get('message') || '';
    const body = `Name: ${name}\nEmail: ${email}\n\n${message}`;
    window.location.href = `mailto:mayramshoaib67@gmail.com?subject=${encodeURIComponent(
      'New message from portfolio site'
    )}&body=${encodeURIComponent(body)}`;
  };

  const submit = async (e) => {
    e.preventDefault();
    setStatus('sending');
    const form = e.target;
    const data = new FormData(form);

    try {
      const res = await fetch('https://formsubmit.co/ajax/mayramshoaib67@gmail.com', {
        method: 'POST',
        headers: { 'Accept': 'application/json' },
        body: data,
      });
      if (res.ok) {
        setStatus('sent');
        form.reset();
      } else {
        openMailFallback(data);
        setStatus('fallback');
      }
    } catch (err) {
      openMailFallback(data);
      setStatus('fallback');
    }
  };

  return (
    <section id="contact">
      <div className="container contact-grid">
        <Reveal as="div" stagger className="contact-info">
          <p className="eyebrow">Get in touch</p>
          <h2>Let's design<br/>something good.</h2>
          <p>Have a project in mind, or just want to say hello? I'd love to hear from you.</p>
          <div className="contact-line"><span className="ic">✉</span><a href="mailto:mayramshoaib67@gmail.com">mayramshoaib67@gmail.com</a></div>
          <div className="contact-line"><span className="ic">☎</span><span>+92 310 2796867</span></div>
          <div className="contact-line"><span className="ic">◎</span><span>Bahawalpur, Pakistan</span></div>
          <div className="contact-line"><span className="ic">in</span><a href="https://linkedin.com/in/Maryam-shoaib" target="_blank" rel="noopener noreferrer">linkedin.com/in/Maryam-shoaib</a></div>
        </Reveal>
        <Reveal className="contact-form">
          {status === 'sent' ? (
            <div style={{padding:'40px 0', textAlign:'center'}}>
              <h3 style={{marginBottom:'10px'}}>Message received</h3>
              <p style={{color:'var(--ink-soft)'}}>Thank you for reaching out — I'll reply to your email soon.</p>
            </div>
          ) : status === 'fallback' ? (
            <div style={{padding:'40px 0', textAlign:'center'}}>
              <h3 style={{marginBottom:'10px'}}>Opening your email app…</h3>
              <p style={{color:'var(--ink-soft)'}}>Just hit send there and your message will reach me directly.</p>
            </div>
          ) : (
            <form onSubmit={submit}>
              <input type="hidden" name="_subject" value="New message from portfolio site" />
              <div className="form-row"><label>Name</label><input type="text" name="name" required placeholder="Your name" /></div>
              <div className="form-row"><label>Email</label><input type="email" name="email" required placeholder="you@email.com" /></div>
              <div className="form-row"><label>Message</label><textarea name="message" required placeholder="Tell me a little about your project..."></textarea></div>
              <button type="submit" className="btn btn-primary" style={{width:'100%', justifyContent:'center'}} disabled={status === 'sending'}>
                {status === 'sending' ? 'Sending...' : 'Send message'}
              </button>
            </form>
          )}
        </Reveal>
      </div>
    </section>
  );
}

/* ---------- BACK TO TOP ---------- */
function BackToTop(){
  const [show,setShow] = useState(false);
  useEffect(() => {
    const onScroll = () => setShow(window.scrollY > 700);
    window.addEventListener('scroll', onScroll);
    return () => window.removeEventListener('scroll', onScroll);
  }, []);
  return (
    <button className={`back-to-top ${show ? 'show':''}`} onClick={() => window.scrollTo({top:0, behavior:'smooth'})} aria-label="Back to top">↑</button>
  );
}
